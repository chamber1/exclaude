server {
    listen 80;
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    root /var/www/html/public;
    index index.php index.html;

    server_tokens off;
    # Webcam snapshots are up to 5 MB.
    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Downloads run in the queue worker; the longest request is the metadata lookup (~30 s).
        fastcgi_read_timeout 120s;
    }

    # Finished downloads. Only reachable through X-Accel-Redirect from DownloadService::deliver(),
    # after PHP has checked the signed link and the owner.
    location /_protected/downloads/ {
        internal;
        alias /var/www/html/storage/app/downloads/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
