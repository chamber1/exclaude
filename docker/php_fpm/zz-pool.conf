; PHP-FPM pool tuning (loaded after the base image's z-overrides.conf).
; Downloads run in the queue worker, so HTTP requests are short: more children, hard request limit.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
; Longest legitimate request: the metadata lookup (downloads.yt_dlp.inspect_timeout = 30 s).
; Files are streamed by nginx (X-Accel-Redirect), not by PHP.
request_terminate_timeout = 120s
