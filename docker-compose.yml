# Local development. Code is bind-mounted, so changes apply without a rebuild.
# Production: docker-compose.prod.yml (see docs/DEPLOYMENT.md).

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: dev
  image: exclaude-app:dev
  volumes:
    - .:/var/www/html
    - ./docker/php_fpm/php.ini:/etc/php/8.1/fpm/conf.d/99-overrides.ini:ro
    - ./docker/php_fpm/php.ini:/etc/php/8.1/cli/conf.d/99-overrides.ini:ro
  environment:
    # Everything else comes from .env (DB_HOST/REDIS_HOST there point to 127.0.0.1 for host tools).
    DB_HOST: mysql
    REDIS_HOST: redis
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web-base
    image: exclaude-nginx:dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1", memory: 256M }

  # PHP-FPM: HTTP requests only (container name kept for the existing `docker exec php_fpm ...` commands).
  app:
    <<: *app
    container_name: php_fpm
    healthcheck:
      test: ["CMD", "php", "artisan", "downloads:health", "app"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "2", memory: 1G }

  # Download jobs (yt-dlp + ffmpeg). One process = one download at a time;
  # scale with `docker compose up -d --scale queue-worker=3`.
  queue-worker:
    <<: *app
    user: www-data
    command: >-
      php artisan queue:work redis --queue=downloads,default
      --tries=2 --timeout=660 --sleep=1 --max-jobs=100 --max-time=3600
    # On stop the worker finishes the current job if it can; an interrupted one is retried (see DownloadJob).
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "php", "artisan", "downloads:health", "worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "2", memory: 1536M }

  scheduler:
    <<: *app
    user: www-data
    command: php artisan schedule:work
    healthcheck:
      test: ["CMD", "php", "artisan", "downloads:health", "scheduler"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  mysql:
    image: mysql:8.0
    # Only reachable from this machine (for GUI clients), not from the network.
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }

  # Queue, cache, sessions, locks. Not published to the host.
  redis:
    image: redis:7.4-alpine
    # noeviction: queued jobs must never be evicted when memory is full.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 320M }

volumes:
  mysql_data:
  redis_data:
